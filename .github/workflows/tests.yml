# Unit tests on every push and pull request.
#
# No secrets, no database, no vector store: every test in tests/ is a pure
# function test. tests/test_glossary_schema.py skips itself when the SQLite
# database is absent, which it always is here -- `-rs` prints those skips so a
# silently-empty run is visible rather than passing quietly.
#
# Cold installs take roughly 5-8 minutes: sentence-transformers pulls torch
# (~800 MB of wheels). The pip cache below removes that cost on reruns whenever
# neither requirements file has changed.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13, not 3.14: every published `unstructured` caps below 3.14.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q -rs
